internal_name: gpt-5.5
provider: openai
provider_slugs:
  openai-codex: gpt-5.5

# Codex CLI on a ChatGPT/Codex SUBSCRIPTION. Use `--agent codex --model openai/gpt-5.5`.
# NOTE: use the model id your Codex plan actually exposes. gpt-5.5 is what the
# SWE-bench Pro reproduce-public-skills harness drives on a subscription
# (MODEL="gpt-5.5"). A made-up id like "gpt-5.5-codex" is rejected with "not supported
# when using Codex with a ChatGPT account" — which model ids a given plan can drive is
# account-dependent, so we don't try to whitelist them.
agent_specific:
  opencode:
    provider_name: openai
    model: gpt-5.5
    thinking_enabled: true
    config:
      "$schema": "https://opencode.ai/config.json"

# Notional only — on a subscription the tokens are covered by the plan. Kept non-zero
# so the live tally still shows progress (cost>0 is the "reached the model" signal).
pricing:
  input: 1.75
  output: 14.00
  cache_read: 0.175
  cache_write: 0
